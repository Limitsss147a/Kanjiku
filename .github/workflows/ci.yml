name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main, 'feature/**']

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install root dependencies
        run: npm ci --workspaces=false --legacy-peer-deps
      - name: Install shared dependencies
        run: cd packages/shared && npm ci --legacy-peer-deps
      - name: Install mobile dependencies
        run: cd apps/mobile && npm ci --legacy-peer-deps
      - name: Install data-pipeline dependencies
        run: cd packages/data-pipeline && npm ci --legacy-peer-deps
      - name: Typecheck shared
        run: cd packages/shared && npm run typecheck
      - name: Typecheck mobile
        run: cd apps/mobile && npm run typecheck
      - name: Typecheck data-pipeline
        run: cd packages/data-pipeline && npm run build:ts

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install root dependencies
        run: npm ci --workspaces=false --legacy-peer-deps
      - name: Install mobile dependencies
        run: cd apps/mobile && npm ci --legacy-peer-deps
      - name: Run mobile tests
        run: cd apps/mobile && npm test --if-present

  build-android-widget:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'android')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install root dependencies
        run: npm ci --workspaces=false --legacy-peer-deps
      - name: Build Android Widget
        working-directory: apps/widget-android
        run: ./gradlew assembleDebug